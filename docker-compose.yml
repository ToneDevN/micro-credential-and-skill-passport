services:
  mongo:
    image: mongo:7
    container_name: skill-passport-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: skill_passport
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: skill-passport-backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/skill_passport
      - NODE_ENV=development
      - CLIENT_URL=http://192.168.137.10:5173
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: skill-passport-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://192.168.137.10:5001/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
